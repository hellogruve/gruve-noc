name: Build and Deploy gruve-noc

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'frontend/**'

env:
  HARBOR_REGISTRY: registry.gruveai.com
  NAMESPACE: gruve-noc

jobs:

  build-backend:
    runs-on: [self-hosted, ocp, gruve-noc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-backend:${{ steps.tag.outputs.TAG }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-backend:latest \
            ./backend
          docker push \
            ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-backend:${{ steps.tag.outputs.TAG }}
          docker push \
            ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-backend:latest

  build-frontend:
    runs-on: [self-hosted, ocp, gruve-noc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-frontend:${{ steps.tag.outputs.TAG }} \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-frontend:latest \
            ./frontend
          docker push \
            ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-frontend:${{ steps.tag.outputs.TAG }}
          docker push \
            ${{ env.HARBOR_REGISTRY }}/${{ env.NAMESPACE }}/noc-agent-frontend:latest

  update-manifests:
    runs-on: [self-hosted, ocp, gruve-noc]
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - name: Set image tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Update image tags
        run: |
          sed -i "s|noc-agent-backend:.*|noc-agent-backend:${{ steps.tag.outputs.TAG }}|g" \
            k8s/gruve-noc-be-deployment.yaml
          sed -i "s|noc-agent-frontend:.*|noc-agent-frontend:${{ steps.tag.outputs.TAG }}|g" \
            k8s/gruve-noc-fe-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/
          git diff --staged --quiet || \
            git commit -m "ci: update images to ${{ steps.tag.outputs.TAG }}"
          git push
